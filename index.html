<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111">
<title>BBiiworkshop 視障語音數拍節拍器</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<header><div class="brand">BBiiworkshop</div><h1>視障語音數拍節拍器</h1></header>

<section class="card">
<h2>目前速度</h2>
<div id="bpm" class="bpm" role="status" aria-live="polite" aria-atomic="true">120 BPM</div>
<button id="voice" class="gold" type="button" aria-label="語音輸入 BPM">🎙️ 語音輸入 BPM</button>
<button id="playBtn" class="playBtn" type="button" aria-label="開始節拍器">▶ 開始節拍器</button>
<div id="status" class="status" role="status" aria-live="polite" aria-atomic="true">請按語音輸入 BPM，例如說「一百二十 BPM」。</div>
</section>

<section class="card">
<h2>選擇拍號</h2>
<button id="meterBtn" class="meterBtn" type="button" aria-label="選擇拍號">4/4 拍 ▾</button>
<div id="meterMenu" class="meterMenu" style="display:none;">
<button class="meterOpt" data-beats="2" aria-label="2/4 拍">2/4</button>
<button class="meterOpt" data-beats="3" aria-label="3/4 拍">3/4</button>
<button class="meterOpt selected" data-beats="4" aria-label="4/4 拍">4/4</button>
<button class="meterOpt" data-beats="5" aria-label="5/8 拍">5/8</button>
<button class="meterOpt" data-beats="6" aria-label="6/8 拍">6/8</button>
</div>
</section>

<section class="card">
<h2>節拍顯示</h2>
<div id="beatsContainer" class="beats" role="group" aria-label="節奏">
<div id="b0" class="beat">1</div><div id="b1" class="beat">2</div><div id="b2" class="beat">3</div><div id="b3" class="beat">4</div>
</div>
<div id="beatStatus" class="status" role="status" aria-live="polite" aria-atomic="true">尚未開始。會用國語數字語音報讀每一拍。</div>
</section>

<section class="card"><h2>操作說明</h2><p>使用 TalkBack 左右滑動。按語音輸入後說出 BPM。選擇拍號（2/4、3/4、4/4、5/8、6/8）。每一拍都會用國語語音報讀數字。</p></section>
</main>
<script src="app.js"></script>
</body>
</html>
